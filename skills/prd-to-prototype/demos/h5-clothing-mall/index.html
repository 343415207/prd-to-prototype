<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>服装商城 - H5 (Single HTML)</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f5f5f5; }
    .product-card { background: white; border-radius: 8px; margin: 12px; overflow: hidden; }
    .product-image { width: 100%; height: 180px; object-fit: cover; }
    .product-info { padding: 12px; }
    .product-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #333; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-price { color: #ff4d4f; font-size: 16px; font-weight: bold; }
    .detail-info { padding: 16px; background: white; }
    .detail-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #333; }
    .detail-price { font-size: 22px; color: #ff4d4f; font-weight: bold; margin-bottom: 16px; }
    .detail-description { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
